spring:
  application:
    name: aigre
  datasource:
    url: jdbc:postgresql://localhost:5434/aigre
    username: aigre
    password: aigre_dev
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    mcp:
      server:
        name: aigre-grievance-tools
        version: 0.1.0
        protocol: STREAMABLE # uppercase -- SSE is deprecated
        type: SYNC
        annotation-scanner:
          enabled: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

llm:
  provider: ollama # anthropic | ollama

ollama:
  base-url: http://localhost:11434
  chat-model: qwen2.5:7b
  embedding-model: nomic-embed-text
  timeout: 120s

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  chat-model: claude-sonnet-5
  timeout: 60s

rag:
  ingest:
    corpus-path: test-data/documents
  retrieval:
    initial-k: 15
    rerank-to: 5

grievances:
  duplicate-window-days: 7

email:
  # Off by default -- no mailbox configured out of the box. See docs/RUNNING.md "Email
  # ingestion" for how to point this at a real or local test mailbox. Every field below is
  # overridable via env vars (Spring relaxed binding: email.imap.host -> EMAIL_IMAP_HOST, etc.)
  # rather than edited here directly -- keeps a real mailbox's address/credentials out of git.
  enabled: false
  imap:
    host:
    port: 993
    protocol: imaps # imaps (implicit TLS, most providers) or imap (plaintext -- local/test only)
    username:
    password:
    folder: INBOX
  poll-interval-ms: 60000

security:
  jwt:
    # Demo-only: a fixed configured secret, not per-restart-random (that would log every
    # employee out on every backend restart) and not pulled from a real secrets manager (that's
    # the real requirement beyond a single-instance demo). 256-bit random value, base64-encoded.
    secret: 6UWjAYsTXxU3N61ttvUPFyDn4JfGXXmMBLTeff9XfKo=
    expiration-hours: 8

logging:
  level:
    com.aigre: INFO
    dev.langchain4j: WARN
