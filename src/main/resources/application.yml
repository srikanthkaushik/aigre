spring:
  application:
    name: aigre
  datasource:
    url: jdbc:postgresql://localhost:5434/aigre
    username: aigre
    password: aigre_dev
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # Department (routing unit) rows for the active domain profile; application-dmv.yml swaps it.
      data-locations: classpath:seed/city/departments.sql
  ai:
    mcp:
      server:
        name: aigre-grievance-tools
        version: 0.1.0
        protocol: STREAMABLE # uppercase -- SSE is deprecated
        type: SYNC
        annotation-scanner:
          enabled: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

llm:
  provider: ollama # anthropic | ollama

ollama:
  base-url: http://localhost:11434
  # General-purpose model (@Primary bean, LlmProviderConfig) -- RAG rerank and the citizen
  # chat's own streaming responses. Deliberately NOT qwen3:8b: rerank calls this once per
  # retrieved candidate per chat question, and a "thinking"-style model there regressed
  # RagEvalSuiteTest badly when tried (see PROJECT.md's "DMV title-correction
  # misclassification" writeup) -- stays on the faster model for that reason, not accuracy.
  chat-model: qwen2.5:7b
  # Classification-only model ("classificationChatModel" qualified bean). One call per
  # grievance, not per RAG candidate, so it can afford qwen3:8b's slower, more-accurate
  # output (~91.9% vs. ~65.9-86.8% measured on the labeled eval set) without the rerank
  # latency problem above.
  classification-chat-model: qwen3:8b
  embedding-model: nomic-embed-text
  timeout: 120s
  # Both models above stay well under this: rerank/classification are single-shot calls
  # (one passage or one complaint, no chat history, no chained context) -- 4096 comfortably
  # covers either. Ollama otherwise defaults to each model's own max context (32768 for the
  # qwen3 family), which multiplies KV-cache VRAM for no benefit here and was the actual
  # cause of qwen3:8b/qwen3:30b-a3b timing out on an 8GB GPU.
  num-ctx: 4096

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  chat-model: claude-sonnet-5
  timeout: 60s

rag:
  ingest:
    corpus-path: test-data/documents
  retrieval:
    initial-k: 15
    rerank-to: 5

chat:
  cache:
    # Exact-match only (ChatResponseCache) -- personalized and tool-triggering answers never
    # reach this cache regardless of these settings. Set enabled: false to kill it without a
    # redeploy if it ever misbehaves.
    enabled: true
    ttl: 30m
    max-size: 500

grievances:
  duplicate-window-days: 7

email:
  # Off by default -- no mailbox configured out of the box. See docs/RUNNING.md "Email
  # ingestion" for how to point this at a real or local test mailbox. Every field below is
  # overridable via env vars (Spring relaxed binding: email.imap.host -> EMAIL_IMAP_HOST, etc.)
  # rather than edited here directly -- keeps a real mailbox's address/credentials out of git.
  enabled: false
  imap:
    host:
    port: 993
    protocol: imaps # imaps (implicit TLS, most providers) or imap (plaintext -- local/test only)
    username:
    password:
    folder: INBOX
  poll-interval-ms: 60000

security:
  cors:
    # Exact values already in use today (localhost dev + Cloudflare quick-tunnel subdomains).
    # Override via SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS (comma-separated) per-deployment --
    # e.g. a docker-compose deployment on a separate box sets this to that box's LAN origin,
    # without editing this default. See SecurityConfig.corsConfigurationSource().
    allowed-origin-patterns: http://localhost:*,https://*.trycloudflare.com
  jwt:
    # Base64, at least 256 bits. Set per deployment via SECURITY_JWT_SECRET; never commit one.
    # This repo is public, so the value that used to live here is compromised -- any deployment
    # still using it must rotate. Left empty, JwtKeyConfig generates a random key per boot (fine
    # for dev; restarts log employees out and drop citizen recognition).
    secret:
    expiration-hours: 8
  # Silent citizen-recognition token (CitizenTokenService) -- deliberately long-lived compared
  # to the employee JWT above: the point is recognizing a returning citizen months later, not a
  # login session. Reuses jwt.secret, not a separate key.
  citizen-token:
    expiration-days: 365

# Domain profile: everything specific to the agency being served. These defaults are the city
# demo; activate the dmv Spring profile (application-dmv.yml) for NH DMV bureaus. Routing units
# stay "departments" in code and the database -- unit-label is only the word the UI shows.
aigre:
  domain:
    classifier-prompt: classpath:prompts/city/classifier.txt
    agency-name: City Services
    tagline: Submit, track, and resolve city service complaints — classified, prioritized, and routed automatically, with a person always in the loop when it matters.
    footer: A city services demonstration portal
    unit-label: Department
    unit-label-plural: Departments
    chat-suggestions:
      - How long does DOT have to repair a reported pothole?
      - Who do I contact if a street light has been out for two weeks?
      - What are my rights if my landlord hasn't fixed a heating outage?
    # An /embed/chat with no department, framed by every department's registered origins. Off for
    # the city: a site registered for one department shouldn't get a widget answering for all.
    agency-wide-embed: false

logging:
  level:
    com.aigre: INFO
    dev.langchain4j: WARN
